<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 506" width="100%" height="100%" style="background: #0d1117; font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap");
      .bg-rect { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; rx: 12px; }
      .header-bar { fill: #161b22; }
      .title-text { font-size: 13px; fill: #8b949e; font-weight: 600; text-anchor: middle; }
      .boot-text { font-size: 13px; fill: #58a6ff; font-weight: 600; opacity: 0; }
      .boot-success { fill: #3fb950; }
      .name-text { font-size: 22px; fill: #f0f6fc; font-weight: 700; letter-spacing: 2px; opacity: 0; }
      .role-text { font-size: 14px; fill: #a5d6ff; font-weight: 600; opacity: 0; }
      .ascii-row { font-size: 10px; font-weight: 600; letter-spacing: 0px; white-space: pre; opacity: 0; }
      .footer-tagline { font-size: 13.5px; fill: #e2e8f0; font-weight: 600; text-anchor: middle; opacity: 0; }
      .footer-stack { font-size: 12.5px; fill: #7d8590; font-weight: 400; text-anchor: middle; opacity: 0; }
      .cursor { fill: #58a6ff; font-weight: 700; animation: blink 1s infinite; }
      
      @keyframes fadeIn {
        0% { opacity: 0; transform: translateY(3px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      
      .boot-1 { animation: fadeIn 0.4s ease forwards 0.20s; }
      .boot-2 { animation: fadeIn 0.4s ease forwards 0.80s; }
      .boot-3 { animation: fadeIn 0.4s ease forwards 1.40s; }
      .boot-4 { animation: fadeIn 0.4s ease forwards 2.00s; }
      .name-anim { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 2.60s; }
      .role-anim { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 2.80s; }
      .footer-anim { animation: fadeIn 0.8s ease forwards 6.00s; }
    </style>
  </defs>
  
  <!-- Terminal Window Container -->
  <rect class="bg-rect" x="4" y="4" width="812" height="498" />
  <path class="header-bar" d="M 5 16 A 11 11 0 0 1 16 5 L 804 5 A 11 11 0 0 1 815 16 L 815 36 L 5 36 Z" />
  <line x1="5" y1="36" x2="815" y2="36" stroke="#30363d" stroke-width="1" />
  
  <!-- macOS Window Control Buttons -->
