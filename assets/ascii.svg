  <circle cx="46" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="66" cy="20" r="6" fill="#27c93f" />
  <text class="title-text" x="410.0" y="24">krishna-prabhav@systems-node ~ profile --render</text>
  
